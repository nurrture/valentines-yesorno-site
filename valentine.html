<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffebee; /* Light pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #d32f2f; /* Red text */
        }

        #container {
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2em;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        #yes {
            background-color: #4caf50; /* Green */
            color: white;
        }

        #no {
            background-color: #f44336; /* Red */
            color: white;
        }

        #response {
            display: none;
            text-align: center;
            font-size: 2em;
            animation: fadeIn 1s;
        }

        /* Heart animation */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Floating hearts background */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #e57373;
            transform: rotate(45deg);
            animation: float 5s infinite ease-in-out;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #e57373;
            border-radius: 50%;
        }

        .heart:before {
            top: -10px;
            left: 0;
        }

        .heart:after {
            left: -10px;
            top: 0;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(45deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Will you be my Valentine? ❤️</h1>
        <button id="yes">Yes!</button>
        <button id="no">No</button>
    </div>
    <div id="response"></div>

    <script>
        // Make the "No" button move around on hover
        const noButton = document.getElementById('no');
        noButton.addEventListener('mouseover', function() {
            const maxX = window.innerWidth - this.offsetWidth;
            const maxY = window.innerHeight - this.offsetHeight;
            this.style.position = 'absolute';
            this.style.left = Math.random() * maxX + 'px';
            this.style.top = Math.random() * maxY + 'px';
        });

        // Handle "Yes" click
        document.getElementById('yes').addEventListener('click', function() {
            document.getElementById('container').style.display = 'none';
            const response = document.getElementById('response');
            response.style.display = 'block';
            response.innerHTML = 'Yay! Happy Valentine\'s Day! 🎉❤️';
        });

        // Generate floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's'; // Random speed
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000); // Remove after animation
        }

        setInterval(createHeart, 300); // Create a new heart every 300ms
    </script>
</body>
</html>
